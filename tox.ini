[tox]
envlist = py312, py313, py314
skip_missing_interpreters = true

[testenv]
description = Run tests for the target Python interpreter
deps =
    -r{toxinidir}/requirements.txt
commands =
    python -c "import mlchem; import numpy, pandas, scipy, sklearn, matplotlib; print('smoke-ok')"
    pytest -vv tests {posargs}

[testenv:py314]
description = Run tests on Python 3.14
