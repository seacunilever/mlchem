name: Compatibility Matrix

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Smoke imports
        run: |
          python -c "import mlchem; import numpy, pandas, scipy, sklearn, matplotlib; print('smoke-ok')"

      - name: Run test suite
        run: |
          pytest -q tests
