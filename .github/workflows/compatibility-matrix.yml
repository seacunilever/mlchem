name: Compatibility Matrix

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Smoke imports
        run: |
          python -c "import mlchem; import numpy, pandas, scipy, sklearn, matplotlib; print('smoke-ok')"

      - name: Run test suite
        run: |
          pytest -vv tests

      - name: Generate coverage badge (py312 only)
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install anybadge pytest-cov
          python -m pytest -q tests --cov=mlchem --cov-config=.coveragerc --cov-branch --cov-report=term --cov-report=xml:coverage.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          pct = round(float(root.get('line-rate', 0.0)) * 100)
          with open('.coverage_percent', 'w', encoding='utf-8') as f:
              f.write(str(pct))
          print(f'coverage-percent={pct}')
          PY
          python -m anybadge --label coverage --value "$(cat .coverage_percent)" --file assets/coverage.svg --overwrite 50=red 60=orange 70=yellow 80=yellowgreen 90=green

      - name: Commit refreshed coverage badge
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: refresh coverage badge"
          file_pattern: assets/coverage.svg
