name: Compatibility Matrix

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }}
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest-cov

      - name: Smoke imports
        run: |
          python -c "import mlchem; import numpy, pandas, scipy, sklearn, matplotlib; print('smoke-ok')"

      - name: Run test suite
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest -q tests --cov=mlchem --cov-config=.coveragerc --cov-branch --cov-report=term --cov-report=xml:coverage.xml
          else
            pytest -vv tests
          fi

      - name: Guard against generated test artifacts
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          forbidden_status=$(git status --porcelain -- \
            'tests/**/test_plot.html' \
            'tests/**/y_scrambling_test_plot.png' \
            'tests/**/SFS_*.png' \
            'tests/**/LogisticRegression()' \
            'tests/**/LogisticRegression()_allcols' \
            'tests/**/LogisticRegression()_best' \
            'tests/**/CLASS_A/' \
            'tests/**/CLASS_B/' \
            'tests/**/.coverage' \
            'tests/**/run.out')
          if [ -n "$forbidden_status" ]; then
            echo "Forbidden generated test artifacts detected:"
            echo "$forbidden_status"
            exit 1
          fi

