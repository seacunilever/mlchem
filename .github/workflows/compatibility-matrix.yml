name: Compatibility Matrix

on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: py${{ matrix.python-version }}
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest-cov

      - name: Smoke imports
        run: |
          python -c "import mlchem; import numpy, pandas, scipy, sklearn, matplotlib; print('smoke-ok')"

      - name: Run test suite
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest -q tests --cov=mlchem --cov-config=.coveragerc --cov-branch --cov-report=term --cov-report=xml:coverage.xml
          else
            pytest -vv tests
          fi

      - name: Guard against generated test artifacts
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          forbidden_status=$(git status --porcelain -- \
            'tests/**/test_plot.html' \
            'tests/**/y_scrambling_test_plot.png' \
            'tests/**/SFS_*.png' \
            'tests/**/LogisticRegression()' \
            'tests/**/LogisticRegression()_allcols' \
            'tests/**/LogisticRegression()_best' \
            'tests/**/CLASS_A/' \
            'tests/**/CLASS_B/' \
            'tests/**/.coverage' \
            'tests/**/run.out')
          if [ -n "$forbidden_status" ]; then
            echo "Forbidden generated test artifacts detected:"
            echo "$forbidden_status"
            exit 1
          fi

  refresh-coverage-badges:
    name: refresh coverage badges after merge
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install pytest-cov anybadge

      - name: Run tests with coverage (py312)
        run: |
          python -m pytest -q tests --cov=mlchem --cov-config=.coveragerc --cov-branch --cov-report=term --cov-report=xml:coverage.xml

      - name: Generate coverage badges
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('coverage.xml').getroot()
          line_pct = round(float(root.get('line-rate', 0.0)) * 100)
          branch_pct = round(float(root.get('branch-rate', 0.0)) * 100)
          with open('.coverage_line_percent', 'w', encoding='utf-8') as f:
            f.write(str(line_pct))
          with open('.coverage_branch_percent', 'w', encoding='utf-8') as f:
            f.write(str(branch_pct))
          print(f'line-coverage-percent={line_pct}')
          print(f'branch-coverage-percent={branch_pct}')
          PY
          python -m anybadge --label "line cov" --value "$(cat .coverage_line_percent)" --file assets/coverage.svg --overwrite 50=red 60=orange 70=yellow 80=yellowgreen 90=green
          python -m anybadge --label "branch cov" --value "$(cat .coverage_branch_percent)" --file assets/coverage-branch.svg --overwrite 50=red 60=orange 70=yellow 80=yellowgreen 90=green

      - name: Create PR with refreshed badges
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ci/refresh-coverage-badges
          delete-branch: true
          commit-message: "ci: refresh coverage badge"
          title: "ci: refresh coverage badge"
          body: "Automated coverage badge refresh after merge into master."
          add-paths: |
            assets/coverage.svg
            assets/coverage-branch.svg
