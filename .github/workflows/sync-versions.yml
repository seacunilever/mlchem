name: Validate Docs Version Sync

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-docs-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install sphinx myst-parser

      - name: Extract version from setup.py
        id: version
        run: |
          VERSION=$(grep "version=" setup.py | sed "s/.*version='\([^']*\)'.*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build docs locally in CI
        run: |
          cd docs
          make clean
          make html

      - name: Assert docs release uses setup.py version
        run: |
          grep -R "mlchem ${{ steps.version.outputs.version }} documentation" docs -n >/dev/null
