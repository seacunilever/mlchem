name: Validate Docs Version Sync

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-docs-version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install sphinx myst-parser

      - name: Extract package version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("_version.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              ):
                  print(ast.literal_eval(node.value))
                  break
          else:
              raise SystemExit("Could not find __version__ in _version.py")
          PY
          )
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build docs locally in CI
        run: |
          cd docs
          make clean
          make html

      - name: Assert docs release uses package version
        run: |
          grep -R "mlchem ${{ steps.version.outputs.version }} documentation" docs -n >/dev/null
